<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>SysMon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="widget">
    <div id="titlebar">
      <span id="title">SYSMON</span>
      <span id="hostname">—</span>
      <div id="win-controls">
        <button id="btn-update" data-i18n-title="widget.update" title="Update available" style="display:none">⬆</button>
        <button id="btn-charts" data-i18n-title="widget.charts" title="Historical curves">📊</button>
        <button id="btn-settings" data-i18n-title="widget.settings" title="Settings">⚙</button>
        <button id="btn-close" data-i18n-title="widget.close" title="Close">✕</button>
      </div>
    </div>
    <div id="content" class="scroll"></div>
    <div id="footer">
      <span id="mode-badge">standalone</span>
      <span id="uptime"></span>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
