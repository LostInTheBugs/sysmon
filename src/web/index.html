<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SysMon — Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SYSMON <span class="thin">DASHBOARD</span></h1>
    <div class="header-right">
      <button id="btn-logs" title="Centralized logs">LOGS</button>
      <button id="btn-theme" title="Theme">◐</button>
      <div id="conn" class="conn">connecting…</div>
    </div>
  </header>
  <main id="hosts"></main>
  <section id="logs-panel" class="hidden">
    <div class="logs-toolbar">
      <span class="logs-title">CENTRALIZED LOGS</span>
      <select id="log-host"><option value="">all hosts</option></select>
      <select id="log-level">
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
      </select>
      <span id="logs-count" class="logs-count"></span>
    </div>
    <div id="logs" class="logs"><div class="logs-empty">No logs yet…</div></div>
  </section>
  <script src="app.js"></script>
</body>
</html>
